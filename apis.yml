aid: ultralight
name: Ultralight
description: Ultralight is an AI-native electronic health record (EHR) and operating
  system for functional, integrative, and longevity medicine practices. The platform
  brings clinical data, workflows, and intelligence into a single system, synthesizing
  wearable data, longitudinal symptoms, labs, and treatment history with a built-in,
  clinician-reviewed clinical intelligence layer, alongside a consumer-grade patient
  app, automated workflows, and HIPAA-compliant infrastructure. Ultralight is headquartered
  in San Francisco and backed by Anthemis through its Female Innovators Lab. The company
  publishes no public developer or API surface today.
